<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Estoque - Todos os Gráficos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f5f7fa; }
        header { background: linear-gradient(135deg, #3498db, #2ecc71); color: white; padding: 1rem 2rem; }
        .container { max-width: 1400px; margin: auto; padding: 20px; }
        .controls { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: #3498db; color: white; }
        .btn-secondary { background: #2ecc71; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn:hover { opacity: 0.9; transform: scale(1.02); }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-3px); }
        .card-header { border-bottom: 1px solid #eee; margin-bottom: 15px; padding-bottom: 10px; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #ecf0f1; }
        .form-container { background: white; padding: 20px; border-radius: 10px; margin: 20px 0; }
        .form-group { display: grid; grid-template-columns: 120px 1fr; margin-bottom: 15px; align-items: center; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        .edit-btn, .delete-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; margin: 0 3px; }
    </style>
</head>
<body>
    <header><h1>📊 Dashboard de Estoque - Gráficos Completos</h1></header>
    <div class="container">
        <div class="controls">
            <button class="btn btn-primary" onclick="showAddForm()">➕ Adicionar Item</button>
            <button class="btn btn-secondary" onclick="showUpdateForm()">✏️ Atualizar Item</button>
            <button class="btn btn-danger" onclick="showRemoveForm()">🗑️ Remover Item</button>
            <button class="btn" onclick="viewInventory()">🔄 Atualizar Inventário</button>
        </div>
        <div id="form-container" class="form-container"></div>
        <div id="inventory-container"></div>
        
        <h2 style="margin: 30px 0 20px;">📈 Análise de Estoque</h2>
        <div class="dashboard-grid">
            <div class="card"><div class="card-header"><h3>📊 Estoque por Setor</h3></div><div class="chart-container"><canvas id="barChart"></canvas></div></div>
            <div class="card"><div class="card-header"><h3>🥧 Distribuição de Itens</h3></div><div class="chart-container"><canvas id="pieChart"></canvas></div></div>
            <div class="card"><div class="card-header"><h3>📈 Movimentação Mensal (ordenado por data)</h3></div><div class="chart-container"><canvas id="lineChart"></canvas></div></div>
            <div class="card"><div class="card-header"><h3>🏆 Top Itens em Estoque</h3></div><div class="chart-container"><canvas id="towerChart"></canvas></div></div>
        </div>
    </div>

    <script>
        // Dados iniciais (com diferentes datas)
        let itens = [
            { codigo: '001', nome: 'Teclado Gamer', qtd: 20, saida: 5, data: '2024-04-09', setor: 'TI' },
            { codigo: '002', nome: 'Mouse Sem Fio', qtd: 30, saida: 10, data: '2024-04-11', setor: 'TI' },
            { codigo: '003', nome: 'Monitor 24"', qtd: 15, saida: 2, data: '2024-04-30', setor: 'Hardware' },
            { codigo: '004', nome: 'Cadeira Premium', qtd: 10, saida: 1, data: '2024-05-14', setor: 'Mobiliário' },
            { codigo: '005', nome: 'Teclado Mecânico', qtd: 60, saida: 30, data: '2025-06-01', setor: 'TI' },
            { codigo: '2035', nome: 'Anel de LED', qtd: 90, saida: 7, data: '2025-06-01', setor: 'TI' },
            { codigo: '006', nome: 'Furadeira', qtd: 8, saida: 2, data: '2024-03-20', setor: 'Ferramentas' }
        ];

        let graficos = { bar: null, pie: null, line: null, tower: null };

        // ========== CRUD ==========
        function showAddForm() {
            const fc = document.getElementById('form-container');
            fc.innerHTML = `<h2>Adicionar Item</h2><form id="addForm">
                <div class="form-group"><label>Código:</label><input type="text" id="codigo" required></div>
                <div class="form-group"><label>Nome:</label><input type="text" id="nome" required></div>
                <div class="form-group"><label>Quantidade:</label><input type="number" id="qtd" required></div>
                <div class="form-group"><label>Saída:</label><input type="number" id="saida" required></div>
                <div class="form-group"><label>Data:</label><input type="date" id="data" required></div>
                <div class="form-group"><label>Setor:</label><input type="text" id="setor" required></div>
                <button type="submit" class="btn btn-primary">Adicionar</button></form>`;
            document.getElementById('addForm').onsubmit = (e) => {
                e.preventDefault();
                itens.push({
                    codigo: document.getElementById('codigo').value,
                    nome: document.getElementById('nome').value,
                    qtd: parseInt(document.getElementById('qtd').value),
                    saida: parseInt(document.getElementById('saida').value),
                    data: document.getElementById('data').value,
                    setor: document.getElementById('setor').value
                });
                refreshAll();
                fc.innerHTML = '';
                alert('Item adicionado!');
            };
        }

        function showUpdateForm() {
            const fc = document.getElementById('form-container');
            fc.innerHTML = `<h2>Atualizar Item</h2><form id="updateForm">
                <div class="form-group"><label>Código:</label><input type="text" id="codigoBusca" required></div>
                <div class="form-group"><label>Novo Nome:</label><input type="text" id="nome"></div>
                <div class="form-group"><label>Nova Quantidade:</label><input type="number" id="qtd"></div>
                <div class="form-group"><label>Nova Saída:</label><input type="number" id="saida"></div>
                <div class="form-group"><label>Nova Data:</label><input type="date" id="data"></div>
                <div class="form-group"><label>Novo Setor:</label><input type="text" id="setor"></div>
                <button type="submit" class="btn btn-secondary">Atualizar</button></form>`;
            document.getElementById('updateForm').onsubmit = (e) => {
                e.preventDefault();
                const cod = document.getElementById('codigoBusca').value;
                const item = itens.find(i => i.codigo === cod);
                if (item) {
                    if (document.getElementById('nome').value) item.nome = document.getElementById('nome').value;
                    if (document.getElementById('qtd').value) item.qtd = parseInt(document.getElementById('qtd').value);
                    if (document.getElementById('saida').value) item.saida = parseInt(document.getElementById('saida').value);
                    if (document.getElementById('data').value) item.data = document.getElementById('data').value;
                    if (document.getElementById('setor').value) item.setor = document.getElementById('setor').value;
                    refreshAll();
                    fc.innerHTML = '';
                    alert('Atualizado!');
                } else alert('Código não encontrado');
            };
        }

        function showRemoveForm() {
            const fc = document.getElementById('form-container');
            fc.innerHTML = `<h2>Remover Item</h2><form id="removeForm">
                <div class="form-group"><label>Código:</label><input type="text" id="codigoRemove" required></div>
                <button type="submit" class="btn btn-danger">Remover</button></form>`;
            document.getElementById('removeForm').onsubmit = (e) => {
                e.preventDefault();
                const cod = document.getElementById('codigoRemove').value;
                const index = itens.findIndex(i => i.codigo === cod);
                if (index !== -1) {
                    itens.splice(index, 1);
                    refreshAll();
                    fc.innerHTML = '';
                    alert('Removido!');
                } else alert('Código não encontrado');
            };
        }

        // Exibir inventário ordenado por data
        function viewInventory() {
            const container = document.getElementById('inventory-container');
            const sorted = [...itens].sort((a,b) => new Date(a.data) - new Date(b.data));
            let html = `<h2>📋 Inventário (ordenado por data)</h2><table><thead><tr><th>Código</th><th>Nome</th><th>Qtd</th><th>Saída</th><th>Após saída</th><th>Data</th><th>Setor</th><th>Ações</th></tr></thead><tbody>`;
            sorted.forEach(item => {
                html += `<tr>
                    <td>${item.codigo}</td><td>${item.nome}</td><td>${item.qtd}</td><td>${item.saida}</td>
                    <td>${item.qtd - item.saida}</td><td>${new Date(item.data).toLocaleDateString('pt-BR')}</td>
                    <td>${item.setor}</td>
                    <td><button class="edit-btn" onclick="editarItem('${item.codigo}')">✏️</button><button class="delete-btn" onclick="removerItem('${item.codigo}')">🗑️</button></td>
                </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        window.editarItem = (codigo) => {
            const item = itens.find(i => i.codigo === codigo);
            if (!item) return;
            const fc = document.getElementById('form-container');
            fc.innerHTML = `<h2>Editar Item</h2><form id="editForm">
                <div class="form-group"><label>Código:</label><input type="text" value="${item.codigo}" disabled></div>
                <div class="form-group"><label>Nome:</label><input type="text" id="nome" value="${item.nome}"></div>
                <div class="form-group"><label>Quantidade:</label><input type="number" id="qtd" value="${item.qtd}"></div>
                <div class="form-group"><label>Saída:</label><input type="number" id="saida" value="${item.saida}"></div>
                <div class="form-group"><label>Data:</label><input type="date" id="data" value="${item.data}"></div>
                <div class="form-group"><label>Setor:</label><input type="text" id="setor" value="${item.setor}"></div>
                <button type="submit" class="btn btn-secondary">Salvar</button></form>`;
            document.getElementById('editForm').onsubmit = (e) => {
                e.preventDefault();
                item.nome = document.getElementById('nome').value;
                item.qtd = parseInt(document.getElementById('qtd').value);
                item.saida = parseInt(document.getElementById('saida').value);
                item.data = document.getElementById('data').value;
                item.setor = document.getElementById('setor').value;
                refreshAll();
                fc.innerHTML = '';
                alert('Editado!');
            };
        };
        window.removerItem = (codigo) => { if(confirm('Remover?')) { const idx = itens.findIndex(i=>i.codigo===codigo); if(idx!==-1) itens.splice(idx,1); refreshAll(); } };

        // ========== GRÁFICOS (TODOS COM VERIFICAÇÃO) ==========
        function criarGraficoBarras() {
            const canvas = document.getElementById('barChart');
            if (!canvas) return console.warn('barChart não encontrado');
            const setores = [...new Set(itens.map(i => i.setor))];
            const valores = setores.map(s => itens.filter(i=>i.setor===s).reduce((acc,i)=>acc + i.qtd * 10, 0));
            if (graficos.bar) graficos.bar.destroy();
            graficos.bar = new Chart(canvas, {
                type: 'bar',
                data: { labels: setores, datasets: [{ label: 'Valor (R$)', data: valores, backgroundColor: '#3498db' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function criarGraficoPizza() {
            const canvas = document.getElementById('pieChart');
            if (!canvas) return console.warn('pieChart não encontrado');
            const setores = [...new Set(itens.map(i => i.setor))];
            const qtds = setores.map(s => itens.filter(i=>i.setor===s).reduce((acc,i)=>acc + i.qtd, 0));
            if (graficos.pie) graficos.pie.destroy();
            graficos.pie = new Chart(canvas, {
                type: 'pie',
                data: { labels: setores, datasets: [{ data: qtds, backgroundColor: ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } }
            });
        }

        function criarGraficoLinha() {
            const canvas = document.getElementById('lineChart');
            if (!canvas) return console.warn('lineChart não encontrado');
            // Agrupar por mês/ano e ordenar por data
            const mov = {};
            itens.forEach(item => {
                const d = new Date(item.data);
                const key = `${d.getFullYear()}-${d.getMonth()+1}`;
                const rotulo = d.toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' });
                if (!mov[key]) mov[key] = { rotulo, entradas: 0, saidas: 0 };
                mov[key].entradas += item.qtd;
                mov[key].saidas += item.saida;
            });
            const ordenado = Object.entries(mov).map(([k,v]) => ({ key: k, ...v })).sort((a,b)=>a.key.localeCompare(b.key));
            const labels = ordenado.map(o => o.rotulo);
            const entradas = ordenado.map(o => o.entradas);
            const saidas = ordenado.map(o => o.saidas);
            if (graficos.line) graficos.line.destroy();
            graficos.line = new Chart(canvas, {
                type: 'line',
                data: { labels, datasets: [
                    { label: 'Entradas', data: entradas, borderColor: '#2ecc71', fill: true, backgroundColor: 'rgba(46,204,113,0.1)' },
                    { label: 'Saídas', data: saidas, borderColor: '#e74c3c', fill: true, backgroundColor: 'rgba(231,76,60,0.1)' }
                ] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function criarGraficoTorre() {
            const canvas = document.getElementById('towerChart');
            if (!canvas) return console.warn('towerChart não encontrado');
            const top5 = [...itens].sort((a,b)=>b.qtd - a.qtd).slice(0,5);
            if (graficos.tower) graficos.tower.destroy();
            graficos.tower = new Chart(canvas, {
                type: 'bar',
                data: { labels: top5.map(i=>i.nome), datasets: [{ label: 'Quantidade', data: top5.map(i=>i.qtd), backgroundColor: '#3498db' }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
            });
        }

        function refreshAll() {
            viewInventory();         // tabela ordenada por data
            criarGraficoBarras();
            criarGraficoPizza();
            criarGraficoLinha();     // este já ordena por data automaticamente
            criarGraficoTorre();
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            refreshAll();
        });
    </script>
</body>
</html>
