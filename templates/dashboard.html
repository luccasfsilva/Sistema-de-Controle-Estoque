<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Estoque - Ordenado por Data</title>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2ecc71;
            --danger: #e74c3c;
            --dark: #34495e;
            --light: #ecf0f1;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 1rem 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            padding: 20px;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-secondary {
            background-color: var(--secondary);
            color: white;
        }
        
        .btn-danger {
            background-color: var(--danger);
            color: white;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            background-color: var(--light);
            font-weight: 600;
        }
        
        tr:hover {
            background-color: rgba(52, 152, 219, 0.05);
        }
        
        .form-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin: 20px 0;
        }
        
        .form-container h2 {
            margin-bottom: 15px;
            color: var(--dark);
        }
        
        .form-group {
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 150px 1fr;
            align-items: center;
            gap: 10px;
        }
        
        input, select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .edit-btn, .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            margin: 0 5px;
        }
        
        .edit-btn:hover { color: var(--primary); }
        .delete-btn:hover { color: var(--danger); }
    </style>
</head>
<body>
    <header>
        <h1>Dashboard de Estoque - Ordenado por Data</h1>
    </header>
    
    <div class="container">
        <!-- Controles -->
        <div class="controls">
            <button class="btn btn-primary" onclick="showAddForm()">Adicionar Item</button>
            <button class="btn btn-secondary" onclick="showUpdateForm()">Atualizar Item</button>
            <button class="btn btn-danger" onclick="showRemoveForm()">Remover Item</button>
            <button class="btn" onclick="viewInventory()">Atualizar Inventário</button>
        </div>
        
        <!-- Form Container -->
        <div id="form-container" class="form-container"></div>
        
        <!-- Inventário -->
        <div id="inventory-container"></div>
        
        <!-- Dashboard de Gráficos -->
        <h2 style="margin: 30px 0 20px;">Análise de Estoque</h2>
        <div class="dashboard-grid">
            <!-- Gráfico de Barras -->
            <div class="card">
                <div class="card-header">
                    <h3>Estoque por Setor</h3>
                </div>
                <div class="chart-container">
                    <canvas id="barChart"></canvas>
                </div>
            </div>
            
            <!-- Gráfico de Pizza -->
            <div class="card">
                <div class="card-header">
                    <h3>Distribuição de Itens</h3>
                </div>
                <div class="chart-container">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
            
            <!-- Gráfico de Linha (ordenado por data) -->
            <div class="card">
                <div class="card-header">
                    <h3>Movimentação Mensal (Ordenado por Data)</h3>
                </div>
                <div class="chart-container">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
            
            <!-- Gráfico de Torre -->
            <div class="card">
                <div class="card-header">
                    <h3>Top Itens (Estoque)</h3>
                </div>
                <div class="chart-container">
                    <canvas id="towerChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- DADOS GLOBAIS (simulando banco de dados) ----------
        let itens = [
            { codigo: '001', nome: 'Teclado Gamer RGB', qtd: 20, saida: 5, data: '2024-04-09', setor: 'TI' },
            { codigo: '002', nome: 'Mouse Sem Fio Ergonômico', qtd: 30, saida: 10, data: '2024-04-11', setor: 'TI' },
            { codigo: '003', nome: 'Monitor LED 24 polegadas', qtd: 15, saida: 2, data: '2024-04-30', setor: 'Hardware' },
            { codigo: '004', nome: 'Cadeira de Escritório Premium', qtd: 10, saida: 1, data: '2024-05-14', setor: 'Mobiliário' },
            { codigo: '005', nome: 'Teclado Mecânico', qtd: 60, saida: 30, data: '2025-06-01', setor: 'TI' },
            { codigo: '2035', nome: 'Anel de Led', qtd: 90, saida: 7, data: '2025-06-01', setor: 'TI' }
        ];

        // Variáveis globais para os gráficos (para poder atualizar)
        let barChart, pieChart, lineChart, towerChart;

        // ---------- FUNÇÕES CRUD ----------
        function showAddForm() {
            const formContainer = document.getElementById('form-container');
            formContainer.innerHTML = `
                <h2>Adicionar Item</h2>
                <form id="addForm">
                    <div class="form-group"><label>Código:</label><input type="text" id="codigo" required></div>
                    <div class="form-group"><label>Nome:</label><input type="text" id="nome" required></div>
                    <div class="form-group"><label>Quantidade:</label><input type="number" id="quantidade" required></div>
                    <div class="form-group"><label>Saída:</label><input type="number" id="saida" required></div>
                    <div class="form-group"><label>Data:</label><input type="date" id="data" required></div>
                    <div class="form-group"><label>Setor:</label><input type="text" id="setor" required></div>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </form>
            `;
            document.getElementById('addForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const novoItem = {
                    codigo: document.getElementById('codigo').value,
                    nome: document.getElementById('nome').value,
                    qtd: parseInt(document.getElementById('quantidade').value),
                    saida: parseInt(document.getElementById('saida').value),
                    data: document.getElementById('data').value,
                    setor: document.getElementById('setor').value
                };
                itens.push(novoItem);
                viewInventory();
                atualizarTodosGraficos();
                formContainer.innerHTML = '';
                alert('Item adicionado com sucesso!');
            });
        }

        function showUpdateForm() {
            const formContainer = document.getElementById('form-container');
            formContainer.innerHTML = `
                <h2>Atualizar Item</h2>
                <form id="updateForm">
                    <div class="form-group"><label>Código do Item:</label><input type="text" id="codigoBusca" required placeholder="Digite o código"></div>
                    <div class="form-group"><label>Novo Nome:</label><input type="text" id="nome"></div>
                    <div class="form-group"><label>Nova Quantidade:</label><input type="number" id="quantidade"></div>
                    <div class="form-group"><label>Nova Saída:</label><input type="number" id="saida"></div>
                    <div class="form-group"><label>Nova Data:</label><input type="date" id="data"></div>
                    <div class="form-group"><label>Novo Setor:</label><input type="text" id="setor"></div>
                    <button type="submit" class="btn btn-secondary">Atualizar</button>
                </form>
            `;
            document.getElementById('updateForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const codigo = document.getElementById('codigoBusca').value;
                const item = itens.find(i => i.codigo === codigo);
                if (item) {
                    if (document.getElementById('nome').value) item.nome = document.getElementById('nome').value;
                    if (document.getElementById('quantidade').value) item.qtd = parseInt(document.getElementById('quantidade').value);
                    if (document.getElementById('saida').value) item.saida = parseInt(document.getElementById('saida').value);
                    if (document.getElementById('data').value) item.data = document.getElementById('data').value;
                    if (document.getElementById('setor').value) item.setor = document.getElementById('setor').value;
                    viewInventory();
                    atualizarTodosGraficos();
                    formContainer.innerHTML = '';
                    alert('Item atualizado!');
                } else {
                    alert('Código não encontrado!');
                }
            });
        }

        function showRemoveForm() {
            const formContainer = document.getElementById('form-container');
            formContainer.innerHTML = `
                <h2>Remover Item</h2>
                <form id="removeForm">
                    <div class="form-group"><label>Código do Item:</label><input type="text" id="codigoRemove" required></div>
                    <button type="submit" class="btn btn-danger">Remover</button>
                </form>
            `;
            document.getElementById('removeForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const codigo = document.getElementById('codigoRemove').value;
                const index = itens.findIndex(i => i.codigo === codigo);
                if (index !== -1) {
                    itens.splice(index, 1);
                    viewInventory();
                    atualizarTodosGraficos();
                    formContainer.innerHTML = '';
                    alert('Item removido!');
                } else {
                    alert('Código não encontrado!');
                }
            });
        }

        // Exibir inventário (tabela ordenada por data)
        function viewInventory() {
            const container = document.getElementById('inventory-container');
            // Ordena os itens por data (mais antigo -> mais recente)
            const itensOrdenados = [...itens].sort((a, b) => new Date(a.data) - new Date(b.data));
            
            let html = `<h2>Inventário Completo (ordenado por data)</h2>
                        <table>
                            <thead><tr><th>Código</th><th>Nome</th><th>Quantidade</th><th>Saída</th><th>Após Saída</th><th>Data</th><th>Setor</th><th>Ações</th></tr></thead>
                            <tbody>`;
            itensOrdenados.forEach(item => {
                const aposSaida = item.qtd - item.saida;
                html += `<tr>
                            <td>${item.codigo}</td>
                            <td>${item.nome}</td>
                            <td>${item.qtd}</td>
                            <td>${item.saida}</td>
                            <td>${aposSaida}</td>
                            <td>${new Date(item.data).toLocaleDateString('pt-BR')}</td>
                            <td>${item.setor}</td>
                            <td>
                                <button class="edit-btn" onclick="editarItem('${item.codigo}')">✏️</button>
                                <button class="delete-btn" onclick="removerItem('${item.codigo}')">🗑️</button>
                            </td>
                        </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // Funções auxiliares para editar/remover direto da tabela
        window.editarItem = function(codigo) {
            const item = itens.find(i => i.codigo === codigo);
            if (item) {
                document.getElementById('form-container').innerHTML = `
                    <h2>Editar Item</h2>
                    <form id="editForm">
                        <div class="form-group"><label>Código:</label><input type="text" value="${item.codigo}" disabled></div>
                        <div class="form-group"><label>Nome:</label><input type="text" id="nome" value="${item.nome}" required></div>
                        <div class="form-group"><label>Quantidade:</label><input type="number" id="qtd" value="${item.qtd}" required></div>
                        <div class="form-group"><label>Saída:</label><input type="number" id="saida" value="${item.saida}" required></div>
                        <div class="form-group"><label>Data:</label><input type="date" id="data" value="${item.data}" required></div>
                        <div class="form-group"><label>Setor:</label><input type="text" id="setor" value="${item.setor}" required></div>
                        <button type="submit" class="btn btn-secondary">Salvar</button>
                    </form>
                `;
                document.getElementById('editForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    item.nome = document.getElementById('nome').value;
                    item.qtd = parseInt(document.getElementById('qtd').value);
                    item.saida = parseInt(document.getElementById('saida').value);
                    item.data = document.getElementById('data').value;
                    item.setor = document.getElementById('setor').value;
                    viewInventory();
                    atualizarTodosGraficos();
                    document.getElementById('form-container').innerHTML = '';
                    alert('Item atualizado!');
                });
            }
        };

        window.removerItem = function(codigo) {
            if (confirm('Tem certeza que deseja remover este item?')) {
                const index = itens.findIndex(i => i.codigo === codigo);
                if (index !== -1) itens.splice(index, 1);
                viewInventory();
                atualizarTodosGraficos();
            }
        };

        // ---------- GRÁFICOS (COM ORDENAÇÃO POR DATA NO GRÁFICO DE LINHA) ----------
        function atualizarTodosGraficos() {
            // 1. Estoque por Setor (Barras)
            const setores = [...new Set(itens.map(i => i.setor))];
            const valoresPorSetor = setores.map(s => 
                itens.filter(i => i.setor === s).reduce((acc, i) => acc + (i.qtd * 10), 0) // valor fictício R$10 por item
            );
            if (barChart) barChart.destroy();
            barChart = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: { labels: setores, datasets: [{ label: 'Valor Estimado (R$)', data: valoresPorSetor, backgroundColor: '#3498db' }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // 2. Distribuição (Pizza)
            const qtdPorSetor = setores.map(s => itens.filter(i => i.setor === s).reduce((acc, i) => acc + i.qtd, 0));
            if (pieChart) pieChart.destroy();
            pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'pie',
                data: { labels: setores, datasets: [{ data: qtdPorSetor, backgroundColor: ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f'] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // 3. Gráfico de Linha (Movimentação Mensal) - ORDENADO POR DATA
            // Agrupa entradas e saídas por mês/ano
            const movimentos = {};
            itens.forEach(item => {
                const dataObj = new Date(item.data);
                const mesAno = `${dataObj.getFullYear()}-${dataObj.getMonth() + 1}`; // formato YYYY-M
                const mesRotulo = dataObj.toLocaleDateString('pt-BR', { month: 'short', year: 'numeric' });
                if (!movimentos[mesAno]) {
                    movimentos[mesAno] = { rotulo: mesRotulo, entradas: 0, saidas: 0 };
                }
                movimentos[mesAno].entradas += item.qtd;
                movimentos[mesAno].saidas += item.saida;
            });
            // Converte para array e ordena por data (chave YYYY-M)
            const movimentosArray = Object.entries(movimentos).map(([key, val]) => ({ key, ...val }));
            movimentosArray.sort((a, b) => a.key.localeCompare(b.key)); // ordenação cronológica
            
            const labelsLinha = movimentosArray.map(m => m.rotulo);
            const entradasLinha = movimentosArray.map(m => m.entradas);
            const saidasLinha = movimentosArray.map(m => m.saidas);
            
            if (lineChart) lineChart.destroy();
            lineChart = new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: {
                    labels: labelsLinha,
                    datasets: [
                        { label: 'Entradas (quantidade)', data: entradasLinha, borderColor: '#2ecc71', fill: true },
                        { label: 'Saídas (quantidade)', data: saidasLinha, borderColor: '#e74c3c', fill: true }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // 4. Top Itens (Torre)
            const topItens = [...itens].sort((a,b) => b.qtd - a.qtd).slice(0,5);
            if (towerChart) towerChart.destroy();
            towerChart = new Chart(document.getElementById('towerChart'), {
                type: 'bar',
                data: {
                    labels: topItens.map(i => i.nome),
                    datasets: [{ label: 'Quantidade', data: topItens.map(i => i.qtd), backgroundColor: '#3498db' }]
                },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false }
            });
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            viewInventory();
            atualizarTodosGraficos();
        });
    </script>
</body>
</html>
